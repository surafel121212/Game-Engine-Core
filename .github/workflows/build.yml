name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | sed -E 's/.*version "([^"]+)".*/\1/' | cut -d. -f1)
          if [ "$JAVA_MAJOR" -eq 1 ] 2>/dev/null; then
            JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | sed -E 's/.*version "([^"]+)".*/\1/' | cut -d. -f2)
          fi
          echo "Detected Java Major Version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ] || [ "$JAVA_MAJOR" -lt 11 ]; then
            echo "Error: Active Java version ($JAVA_MAJOR) is lower than 11!"
            exit 1
          fi

      - name: Create temporary debug keystore
        run: |
          cd Cobalt2D/android
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Successfully verified ./debug.keystore exists."

      - name: Build Debug APK
        run: |
          cd Cobalt2D/android
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK exists
        run: |
          if [ -f "Cobalt2D/android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Cobalt2D/android/app/build/outputs/apk/debug/app-debug.apk exists."
          else
            echo "Error: Expected APK does not exist!"
            echo "Searching for APK files:"
            find Cobalt2D/android/app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cobalt2d-debug-apk
          path: Cobalt2D/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
